<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5ef">
    <meta name="description" content="Set a timer or choose a random duration with Tomatotimer.">
    <title>Tomatotimer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='12' fill='%23b83b2c'/%3E%3Cpath d='M16 9V3M10 6l6 3 6-3' stroke='%233b6045' stroke-width='3' fill='none'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css?v=1229e692d9">
    <script src="app.js?v=f8615ddc97" defer></script>
  </head>
  <body>
    <header class="site-header">
      <h1 class="site-title"><a class="wordmark" href="./" aria-label="Tomatotimer home"><svg aria-hidden="true" viewBox="0 0 32 32"><path d="M16 10C1 3 0 28 16 29c16-1 15-26 0-19Z" fill="currentColor"/><path d="M16 11V3m-6 3 6 5 6-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>tomatotimer<span class="wordmark-dot">.</span></a></h1>
      <div class="local-clock"><span class="clock-dot" aria-hidden="true"></span><span>Local time</span><time id="clock">--:--</time></div>
    </header>
    <main>
      <section class="timer-card" aria-label="Timer">
        <div class="dial">
          <svg class="ring" viewBox="0 0 300 300" aria-hidden="true"><circle class="ring-track" cx="150" cy="150" r="141"/><circle id="progress" class="ring-progress" cx="150" cy="150" r="141" pathLength="100"/></svg>
          <div class="dial-content"><span id="state-label" class="state-label">Ready</span><div class="countdown-display" role="group" aria-label="Timer duration"><input id="dial-minutes" type="text" inputmode="numeric" maxlength="2" pattern="[0-9]*" value="00" placeholder="00" autocomplete="off" aria-label="Timer minutes" aria-describedby="minutes-error" title="Click to set minutes"><span aria-hidden="true">:</span><input id="dial-seconds" type="text" inputmode="numeric" maxlength="2" pattern="[0-9]*" value="00" placeholder="00" autocomplete="off" aria-label="Timer seconds" aria-describedby="seconds-error" title="Click to set seconds"></div><span id="countdown" class="sr-only" role="timer" aria-live="off" aria-label="Time remaining">00:00</span><span id="dial-caption">MINUTES / SECONDS</span></div>
        </div>
        <p id="session-summary" class="session-summary"></p>
        <form id="timer-form" novalidate>
          <fieldset id="mode-fields" class="mode-switch"><legend class="sr-only">Timer mode</legend><label><input type="radio" name="mode" value="manual" checked><span>Set timer</span></label><label><input type="radio" name="mode" value="random"><span><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3"/><circle cx="7" cy="7" r="1"/><circle cx="13" cy="13" r="1"/><circle cx="10" cy="10" r="1"/></svg>Random timer</span></label></fieldset>
          <fieldset id="duration-fields"><legend class="sr-only">Choose duration</legend>
            <div id="manual-inputs" class="input-row"><div class="field"><label for="minutes">Minutes</label><input id="minutes" name="minutes" type="number" inputmode="numeric" min="0" max="59" step="1" value="0" placeholder="0" aria-describedby="minutes-error"><span id="minutes-error" class="field-error"></span></div><span class="input-divider" aria-hidden="true">:</span><div class="field"><label for="seconds">Seconds</label><input id="seconds" name="seconds" type="number" inputmode="numeric" min="0" max="59" step="1" value="0" aria-describedby="seconds-error"><span id="seconds-error" class="field-error"></span></div></div>
            <div id="random-inputs" class="input-row" hidden><div class="field"><label for="minimum">Min minutes</label><input id="minimum" name="minimum" type="number" inputmode="numeric" min="1" max="59" step="1" value="17" aria-describedby="minimum-error"><span id="minimum-error" class="field-error"></span></div><span class="input-divider range-divider" aria-hidden="true">–</span><div class="field"><label for="maximum">Max minutes</label><input id="maximum" name="maximum" type="number" inputmode="numeric" min="1" max="59" step="1" value="25" aria-describedby="maximum-error"><span id="maximum-error" class="field-error"></span></div></div>
          </fieldset>
          <p id="setup-hint" class="setup-hint">1 second to 59 minutes, 59 seconds.</p>
          <div class="actions"><button id="primary-action" class="primary" type="submit">Start timer <span aria-hidden="true">↗</span></button><button id="reset-action" class="secondary" type="button">Reset</button></div>
        </form>
        <div class="sound-row"><label class="sound-control"><input id="sound" type="checkbox" role="switch" checked><span class="switch-track" aria-hidden="true"></span><span>Chime when done</span></label><span id="sound-status">Sound on</span></div>
        <p id="audio-note" class="audio-note" hidden>Sound is unavailable in this browser. Your timer will still finish on screen.</p>
      </section>
      <noscript><p class="noscript">Please enable JavaScript to use the timer. It runs entirely in your browser.</p></noscript>
    </main>
    <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
